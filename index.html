<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>文色</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
  <link rel="stylesheet" href="./assets/style.css?v=3" />
  <link rel="stylesheet" href="./assets/achievements.css?v=3" />
  <link rel="stylesheet" href="./assets/storyboard.css?v=5" />
</head>
<body>
  <div id="app">
    <!-- 画布区 -->
    <main id="stage-wrap">
      <canvas id="stage"></canvas>
      <canvas id="stage-particles"></canvas>
      <div id="legend"></div><div id="ai-story"></div>
      <div id="storyboard-caption" class="hidden" role="group" aria-label="当前分镜">
        <h2 id="scene-title"></h2>
        <p id="scene-caption"></p>
      </div>
      <div id="analysis-wait" class="analysis-wait hidden" role="status" aria-live="polite">
        <strong>让心情慢慢显色</strong>
        <span class="wait-hint">轻点画布，泛起涟漪</span>
      </div>
      <div id="analysis-fallback" class="analysis-fallback hidden" role="status" aria-live="polite">
        <span class="fallback-spark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M32 10C19 10 9 19 9 31s10 23 23 23h4c6 0 9-4 7-8-2-3-1-6 3-7h3c5 0 7-4 6-9C53 18 43 10 32 10Z" fill="url(#fallback-palette)" stroke="#a8a1d4" stroke-width="1.5"/><circle cx="23" cy="23" r="4" fill="#efb5c5"/><circle cx="35" cy="20" r="4" fill="#efd89c"/><circle cx="45" cy="28" r="4" fill="#a9ccda"/><circle cx="19" cy="36" r="4" fill="#b5b3dc"/><defs><linearGradient id="fallback-palette" x1="9" y1="10" x2="55" y2="54"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9e5fa"/></linearGradient></defs></svg></span>
        <strong id="fallback-title">调色盘正在挠头</strong>
        <p id="fallback-message">这段心情把调色盘难住了，换个说法再试试？</p>
        <div class="fallback-actions">
          <button id="btn-analysis-edit" class="action-btn">换个说法</button>
          <button id="btn-analysis-retry" class="action-btn primary hidden">再试一次</button>
        </div>
      </div>
    </main>

    <!-- 输入与控制 -->
    <section id="control-panel">
      <section id="storyboard-controls" class="hidden" aria-label="情绪分镜播放控制">
        <div class="storyboard-head">
          <span>✦ 情绪分镜</span>
          <div class="storyboard-actions">
            <button id="btn-storyboard-overview" class="hidden" type="button" aria-label="返回整体色卡">← 整体色卡</button>
            <button id="btn-storyboard-play" class="storyboard-play" type="button" aria-pressed="false">
              <svg id="storyboard-play-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path id="storyboard-icon-play" d="M5 3l7.5 5L5 13z" fill="currentColor" />
                <g id="storyboard-icon-pause" class="hidden" fill="currentColor">
                  <rect x="4" y="3" width="3" height="10" rx=".8" />
                  <rect x="9" y="3" width="3" height="10" rx=".8" />
                </g>
                <path id="storyboard-icon-replay" class="hidden" d="M13 6.5A5 5 0 1 0 12.5 11M13 2.5v4h-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span id="storyboard-play-label">播放</span>
            </button>
          </div>
        </div>
        <div id="storyboard-scenes"></div>
        <span id="storyboard-status" class="storyboard-sr-only" role="status" aria-live="polite"></span>
      </section>
      <div id="input-row">
        <div class="input-box">
          <textarea id="text-input" rows="2" maxlength="500"
            placeholder="写下此刻的心情，比如：深夜加班，又累又委屈…"></textarea>
          <button id="btn-clear-input" class="input-clear hidden" aria-label="清空输入">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <div id="example-row">
        <button class="example-chip" data-text="早上收到录取消息，我兴奋得跳起来。下午得知要离开熟悉的城市，又忍不住难过。晚上和朋友好好告别后，虽然不舍，也开始期待新的生活。">试试情绪分镜</button>
        <button class="example-chip" data-text="今天天气超好，和朋友去野餐，吃到了想念很久的蛋糕，开心到飞起！">开心一下</button>
      </div>
      <div id="action-row">
        <button id="btn-save" class="action-btn">保存相册</button>
        <button id="btn-share" class="action-btn primary">发笔记</button>
        <button id="btn-achievements" class="icon-btn" aria-label="成就栏">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3"/><path d="M17 6h3v2a3 3 0 0 1-3 3"/>
          </svg>
        </button>
        <button id="btn-settings" class="icon-btn" aria-label="设置">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- 成就视图 -->
    <div id="view-achievements" class="overlay hidden">
      <div class="panel collection-panel">
        <div class="panel-head">
          <div class="collection-heading"><span class="collection-eyebrow">COLOR YOUR DAYS</span><span class="panel-title">情绪收藏馆</span></div>
          <button class="text-btn close-overlay" data-target="view-achievements">关闭</button>
        </div>
        <div class="collection-scroll scroll-container">
          <section class="collection-summary">
            <div class="collection-orbit" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
            <span class="collection-kicker">每一种心情，都值得被收藏</span>
            <div class="collection-count-row"><span>已遇见<br /><em>种不同的自己</em></span><strong id="collection-count">0 / 28</strong></div>
            <div id="collection-progress" class="collection-progress" role="progressbar" aria-label="人格收集进度" aria-valuemin="0" aria-valuemax="28" aria-valuenow="0"><span id="collection-progress-fill"></span></div>
            <p id="collection-summary-note">每一种心情，都有一张属于它的色卡。</p>
          </section>
          <div id="collection-tabs" class="collection-tabs" role="tablist" aria-label="图鉴分类">
            <button id="tab-personalities" class="collection-tab active" role="tab" aria-selected="true">人格图鉴</button>
            <button id="tab-exploration" class="collection-tab" role="tab" aria-selected="false">探索成就</button>
          </div>
          <div id="collection-section-intro" class="collection-section-intro">
            <span id="collection-section-title">你的人格色谱</span><span id="collection-section-note">点击卡片，回看心情</span>
          </div>
          <div id="achievement-grid" class="achievement-grid" role="tabpanel"></div>
          <div id="exploration-list" class="exploration-list hidden" role="tabpanel"></div>
          <div id="collection-detail" class="collection-detail hidden">
            <button id="btn-collection-back" class="text-btn">← 返回图鉴</button>
            <div id="collection-detail-hero" class="collection-detail-hero">
              <img id="collection-detail-icon" alt="" />
              <div><span id="collection-detail-category" class="collection-eyebrow"></span><h3 id="collection-detail-title"></h3><span id="collection-detail-date"></span></div>
            </div>
            <p id="collection-detail-hint"></p>
            <div id="collection-history-heading" class="collection-history-heading">心情留影<span id="collection-history-count"></span></div>
            <div id="collection-cards" class="collection-cards"></div>
            <img id="collection-card-preview" class="collection-card-preview hidden" alt="历史色卡海报" />
          </div>
        </div>
      </div>
    </div>

    <!-- 设置视图 -->
    <div id="view-settings" class="overlay hidden">
      <div class="panel">
        <div class="panel-head">
          <span class="panel-title">设置</span>
          <button class="text-btn close-overlay" data-target="view-settings">关闭</button>
        </div>
        <div class="panel-body scroll-container">
          <label class="setting-row">
            <span>色盲友好模式</span>
            <input type="checkbox" id="set-colorblind" />
          </label>
          <label class="setting-row">
            <span>暗色界面</span>
            <input type="checkbox" id="set-dark" />
          </label>
          <div class="setting-note">
            AI分析情绪占比，程序沿用原有算法生成配色与动态效果。
          </div>
        </div>
      </div>
    </div>

    <!-- 海报预览 -->
    <div id="view-poster" class="overlay hidden">
      <div class="panel poster-panel">
        <div class="panel-head">
          <span class="panel-title">海报预览</span>
          <button class="text-btn close-overlay" data-target="view-poster">关闭</button>
        </div>
        <div class="panel-body scroll-container">
          <div class="seg-control poster-style-row" role="radiogroup" aria-label="海报风格">
            <button type="button" class="seg-btn" data-style="radar">雷达图</button>
            <button type="button" class="seg-btn" data-style="mandala">曼陀罗</button>
          </div>
          <img id="poster-preview-img" alt="海报预览" />
          <div id="poster-actions" class="poster-actions">
            <button id="btn-preview-save" class="action-btn hidden">保存相册</button>
            <button id="btn-preview-share" class="action-btn primary hidden">发笔记</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
    <div id="collection-unlock" class="collection-unlock hidden" role="status" aria-live="polite">
      <span class="unlock-spark" aria-hidden="true">✦</span>
      <div><span class="unlock-caption">新成就解锁</span><strong id="collection-unlock-name"></strong><span id="collection-unlock-note" class="unlock-note"></span></div>
    </div>
  </div>

  <script src="./assets/engine/color.js?v=38"></script>
  <script src="./assets/engine/analyzer.js?v=41"></script>
  <script src="./assets/session.js?v=38"></script>
  <script src="./assets/engine/model-presets.js?v=1"></script>
  <script src="./assets/engine/ai.js?v=48"></script>
  <script src="./assets/engine/strategies.js?v=38"></script>
  <script src="./assets/engine/renderer.js?v=45"></script>
  <script src="./assets/bridge.js?v=38"></script>
  <script src="./assets/store.js?v=38"></script>
  <script src="./assets/views/achievements.js?v=41"></script>
  <script src="./assets/views/settings.js?v=38"></script>
  <script src="./assets/storyboard.js?v=5"></script>
  <script src="./assets/app.js?v=41"></script>
</body>
</html>
